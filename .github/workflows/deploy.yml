name: deploy

on:
  # 每当 push 到 main 分支时触发部署
  # Deployment is triggered whenever a push is made to the main branch.
  push:
    branches: [main]
  # 手动触发部署
  # Manually trigger deployment
  workflow_dispatch:

jobs:
  docs:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          # “最近更新时间” 等 git 日志相关信息，需要拉取全部提交记录
          # "Last updated time" and other git log-related information require fetching all commit records.
          fetch-depth: 0

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      # 可选：缓存 crates 索引与源码，加速首次安装或版本升级
      - name: Cache cargo registry
        uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-registry-${{ runner.os }}-stable

      # 安装最新版本的 RustPress（每次都会检查并安装最新版本）
      - name: Install RustPress
        run: cargo install rustpress --locked

      - name: Verify RustPress
        run: rustpress -V

      - name: Build site with RustPress
        run: rustpress -m source build -o public

      - name: Copy static resources
        run: |
      # 原生极速推送到目标静态展示页仓库（支持无 Token 安全跳过）
      - name: Deploy to rixingyike.github.io
        env:
          TOKEN: ${{ secrets.EXTERNAL_REPOSITORY_PERSONAL_ACCESS_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "⚠️ 提示: 未在仓库 Settings -> Secrets 中配置 EXTERNAL_REPOSITORY_PERSONAL_ACCESS_TOKEN，跳过推送到外部仓库。"
            exit 0
          fi
          echo "🚀 开始推送到 rixingyike.github.io..."
          cd public
          git init
          git config user.name "github-actions[bot]"
          git config user.email "9830131@qq.com"
          git add -A
          git commit -m "Deploy from yishulun_mdsrc commit: ${{ github.sha }}" || true
          git branch -M main
          git push --force "https://rixingyike:${TOKEN}@github.com/rixingyike/rixingyike.github.io.git" main:main
          echo "✅ 部署完成！"
